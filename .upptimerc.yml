owner: droovin
repo: upptime

sites:
  - name: API
    url: https://api.droovin.com/api/health
    expectedStatusCodes:
      - 200
  - name: Panel de administración
    url: https://admin.droovin.com
    expectedStatusCodes:
      - 200
  - name: Tiendas en línea
    url: https://demo-store.droovin.com
    expectedStatusCodes:
      - 200
      - 404
  - name: Sitio web
    url: https://droovin.com
    expectedStatusCodes:
      - 200

status-website:
  cname: status.droovin.com
  logoUrl: https://droovin.com/logo.svg
  name: Droovin Status
  introTitle: "**Droovin Status** — el estado en tiempo real de los servicios que tu tienda usa."
  introMessage: Verificamos cada minuto que todo esté funcionando. Si ves algún componente caído, ya estamos trabajando para resolverlo. Para soporte directo, escríbenos a soporte@droovin.com.
  navbar:
    - title: Estado
      href: /
    - title: Droovin
      href: https://droovin.com
  # Esconde el footer "powered by Upptime" + link al repo en github.com.
  # Upptime no tiene flag nativo para sacarlo, pero permite inyectar CSS.
  customCSS: |
    footer { display: none !important; }

assignees:
  - figueroabonacic

notifications:
  - type: slack
    channel: alertas
    url: "$SLACK_WEBHOOK_URL"

i18n:
  activeIncidents: "Incidentes activos"
  allSystemsOperational: "Todos los sistemas operativos"
  degradedPerformance: "Rendimiento degradado"
  fetchHistoryFail: "No se pudieron cargar los datos históricos"
  incidents: "Incidentes"
  liveStatus: "Estado en vivo"
  pastIncidents: "Incidentes pasados"
  status: "Estado"
  upDay: "día activo"
  upHour: "hora activa"
  upMinute: "minuto activo"
  upWeek: "semana activa"
  responseTime: "Tiempo de respuesta"
  uptime: "Disponibilidad"
  responseTimeChartTitle: "Gráfico de tiempo de respuesta de los últimos 24 días"
  uptimeChartTitle: "Gráfico de disponibilidad de los últimos 24 días"
