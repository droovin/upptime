owner: droovin
repo: upptime

sites:
  - name: API
    url: https://api.droovin.com/api/health
    expectedStatusCodes:
      - 200
  - name: Admin
    url: https://admin.droovin.com
    expectedStatusCodes:
      - 200
  - name: Storefront platform
    url: https://demo-store.droovin.com
    expectedStatusCodes:
      - 200
      - 404
  - name: Landing
    url: https://droovin.com
    expectedStatusCodes:
      - 200
  - name: Superadmin
    url: https://ops.droovin.com
    expectedStatusCodes:
      - 200
      - 401

status-website:
  cname: status.droovin.com
  logoUrl: https://droovin.com/favicon.svg
  name: Droovin Status
  introTitle: "**Droovin Status** — el estado en tiempo real de los servicios que tu tienda usa."
  introMessage: Monitoreamos cada minuto desde GitHub Actions. Si ves algún componente caído, ya estamos trabajando para resolverlo. Para soporte directo, escríbenos a soporte@droovin.com.
  navbar:
    - title: Estado
      href: /
    - title: Droovin
      href: https://droovin.com

assignees:
  - figueroabonacic

notifications:
  - type: slack
    channel: alertas
    url: "$SLACK_WEBHOOK_URL"

# Subir sample interval default a 5min (es el mínimo de GH Actions cron).
# Bajar tasa de noise: solo abrir issue cuando hay 2 fallos consecutivos.
i18n:
  activeIncidents: "Incidentes activos"
  allSystemsOperational: "Todos los sistemas operativos"
  degradedPerformance: "Rendimiento degradado"
  fetchHistoryFail: "No se pudieron cargar los datos históricos"
  incidents: "Incidentes"
  liveStatus: "Estado en vivo"
  pastIncidents: "Incidentes pasados"
  status: "Estado"
  upDay: "día activo"
  upHour: "hora activa"
  upMinute: "minuto activo"
  upWeek: "semana activa"
  responseTime: "Tiempo de respuesta"
  uptime: "Disponibilidad"
  responseTimeChartTitle: "Gráfico de tiempo de respuesta de los últimos 24 días"
  uptimeChartTitle: "Gráfico de disponibilidad de los últimos 24 días"
