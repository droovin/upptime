owner: droovin
repo: upptime

sites:
  - name: API
    url: https://api.droovin.com/api/health
    expectedStatusCodes:
      - 200
  - name: Panel de administración
    url: https://admin.droovin.com
    expectedStatusCodes:
      - 200
  - name: Tiendas en línea
    url: https://demo-store.droovin.com
    expectedStatusCodes:
      - 200
      - 404
  - name: Sitio web
    url: https://droovin.com
    expectedStatusCodes:
      - 200

status-website:
  cname: status.droovin.com
  logoUrl: https://droovin.com/favicon.svg
  # name aparece DOS veces: como <title> de la pestaña y como texto al lado del
  # logo en el navbar. "Droovin Status" se duplicaba con el H1 del intro.
  # Lo dejo como "Droovin" — limpio en tab y navbar, sin redundancia.
  name: Droovin
  introTitle: "El estado en tiempo real de los servicios de Droovin."
  introMessage: Verificamos cada minuto que todo esté funcionando. Si ves algún componente caído, ya estamos trabajando para resolverlo.
  navbar:
    - title: Estado
      href: /
    - title: Volver a Droovin
      href: https://droovin.com

assignees:
  - figueroabonacic

notifications:
  - type: slack
    channel: alertas
    url: "$SLACK_WEBHOOK_URL"

i18n:
  activeIncidents: "Incidentes activos"
  allSystemsOperational: "Todos los sistemas operativos"
  degradedPerformance: "Rendimiento degradado"
  fetchHistoryFail: "No se pudieron cargar los datos históricos"
  incidents: "Incidentes"
  liveStatus: "Estado en vivo"
  pastIncidents: "Incidentes pasados"
  status: "Estado"
  upDay: "día activo"
  upHour: "hora activa"
  upMinute: "minuto activo"
  upWeek: "semana activa"
  responseTime: "Tiempo de respuesta"
  uptime: "Disponibilidad"
  responseTimeChartTitle: "Gráfico de tiempo de respuesta de los últimos 24 días"
  uptimeChartTitle: "Gráfico de disponibilidad de los últimos 24 días"
