name: Static Site CI
on:
  schedule:
    - cron: "0 1 * * *"
  repository_dispatch:
    types: [static_site]
  workflow_dispatch:
jobs:
  release:
    name: Build and deploy site
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Generate site
        uses: upptime/uptime-monitor@v1.41.2
        with:
          command: "site"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - name: Post-process — Droovin theme + remove footer
        run: |
          OUT="site/status-page/__sapper__/export"
          # 1) Light theme — overrides puntuales (mantenemos el bg blanco
          #    y solo cambiamos el accent verde a azul Droovin #2563eb).
          [ -f "$OUT/themes/light.css" ] && sed -i -E '
            s/--up-border-left-color: #[0-9a-fA-F]+;/--up-border-left-color: #2563eb;/g;
            s/--tag-up-background-color: #[0-9a-fA-F]+;/--tag-up-background-color: #2563eb;/g;
            s/--nav-current-border-bottom-color: #[0-9a-fA-F]+;/--nav-current-border-bottom-color: #2563eb;/g;
          ' "$OUT/themes/light.css"
          # 2) Dark theme — el default de Upptime usa teal en TODO (#001716,
          #    #002b29, #015450) que no matchea con la paleta de Droovin
          #    (azul + grises neutros como zinc-900/zinc-800, igual que el
          #    storefront/admin). Reemplazamos todos los teal por zinc.
          [ -f "$OUT/themes/dark.css" ] && cat > "$OUT/themes/dark.css" <<'CSS'
          :root {
            --body-background-color: #0a0a0a;     /* near-black */
            --body-text-color: #fafafa;
            --card-background-color: #18181b;     /* zinc-900 */
            --nav-background-color: #18181b;
            --nav-border-bottom-color: #27272a;   /* zinc-800 */
            --nav-current-border-bottom-color: #2563eb;
            --card-border-color: #27272a;
            --down-border-left-color: #ef4444;    /* red-500 */
            --down-background-color: #450a0a;     /* red-950 */
            --degraded-border-left-color: #f59e0b;/* amber-500 */
            --up-border-left-color: #2563eb;      /* Droovin blue */
            --tag-color: #fafafa;
            --tag-up-background-color: #2563eb;
            --tag-down-background-color: #ef4444;
            --tag-degraded-background-color: #f59e0b;
            --change-background-color: #f59e0b;
            --error-button-border-color: #1d4ed8;
            --error-button-background-color: #2563eb;
            --error-button-color: #ffffff;
            --submit-button-border-color: #1d4ed8;
            --submit-button-background-color: #2563eb;
            --submit-button-color: #ffffff;
            --graph-opacity: 1;
            --graph-filter: none;
          }
          CSS
          # 3) Remover el footer "powered by Upptime / open source" de TODOS
          # los HTML. Upptime no soporta customCSS/customHTML upstream.
          find "$OUT" -name '*.html' -exec sed -i -E 's|<footer class=svelte-jbr799>.*</footer>|<!-- footer removed during post-process -->|g' {} \;
          # 4) Inyectar CSS extra en cada index.html para constreñir el logo
          # y refinar tipografía. Lo metemos antes de </head> en todas las
          # páginas (raíz, /history, /summary, etc).
          STYLE='<style>nav .logo img{max-height:24px;width:auto}nav .logo>div{display:none}main h1{font-weight:700;letter-spacing:-0.02em}</style>'
          find "$OUT" -name '*.html' -exec sed -i "s|</head>|${STYLE}</head>|" {} \;
      - uses: peaceiris/actions-gh-pages@v4
        name: GitHub Pages Deploy
        with:
          github_token: ${{ secrets.GH_PAT || github.token }}
          publish_dir: "site/status-page/__sapper__/export/"
          force_orphan: "false"
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
