name: Setup CI
on:
  push:
    paths:
      - ".upptimerc.yml"
  repository_dispatch:
    types: [setup]
  workflow_dispatch:
jobs:
  release:
    name: Setup Upptime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT || github.token }}
      # update-template skippeado a proposito: requiere PAT con scope `workflow`
      # para sobrescribir archivos en .github/workflows. El GITHUB_TOKEN default
      # no lo permite. Perdemos auto-update del template (corre semanal en
      # upstream) pero lo manejamos manualmente cuando haya nuevas releases.
      - name: Update response time
        uses: upptime/uptime-monitor@v1.41.2
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
      - name: Update summary in README
        uses: upptime/uptime-monitor@v1.41.2
        with:
          command: "readme"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - name: Generate graphs
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Graphs CI
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Generate site
        uses: upptime/uptime-monitor@v1.41.2
        with:
          command: "site"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - name: Post-process — Droovin theme + remove footer
        # Mismo tratamiento que en site.yml. Mantenido idéntico para que ambos
        # paths de deploy (push a .upptimerc.yml y cron diario de Static Site CI)
        # produzcan el mismo HTML/CSS final.
        run: |
          OUT="site/status-page/__sapper__/export"
          for css in "$OUT"/themes/light.css "$OUT"/themes/dark.css; do
            [ -f "$css" ] && sed -i -E '
              s/--up-border-left-color: #[0-9a-fA-F]+;/--up-border-left-color: #2563eb;/g;
              s/--tag-up-background-color: #[0-9a-fA-F]+;/--tag-up-background-color: #2563eb;/g;
              s/--nav-current-border-bottom-color: #[0-9a-fA-F]+;/--nav-current-border-bottom-color: #2563eb;/g;
            ' "$css"
          done
          find "$OUT" -name '*.html' -exec sed -i -E 's|<footer class=svelte-jbr799>.*</footer>|<!-- footer removed during post-process -->|g' {} \;
      - uses: peaceiris/actions-gh-pages@v4
        name: GitHub Pages Deploy
        with:
          github_token: ${{ secrets.GH_PAT || github.token }}
          publish_dir: "site/status-page/__sapper__/export/"
          force_orphan: "false"
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
